<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo List</title>
    </head>
    <body>
        <dialog open>
            <form>
                <div>
                    <label for="task-title">Title:</label>
                    <input type="text" id="task-title" />
                </div>
                <div>
                    <label for="task-priority">Priority:</label>
                    <select id="task-priority">
                        <option value="high">High</option>
                        <option value="normal" selected>Normal</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div>
                    <label for="task-project">Project:</label>
                    <select id="task-project">
                        <option value="none">None</option>
                    </select>
                </div>
                <div>
                    <label for="task-dueDate">Deadline:</label>
                    <input type="date" id="task-dueDate" />
                </div>
                <button type="submit" class="add-task">Add Task</button>
            </form>
        </dialog>

        <dialog open style="margin-left: 1000px;">
            <form>
                <div>
                    <label for="project-title">Title</label>
                    <input type="text" id="project-title" />
                </div>
                <button type="submit" class="add-project">Add Project</button>
            </form>
        </dialog>
        <div class="task-list"></div>
        <div class="project-list"></div>
    </body>
</html>
