<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo List</title>
    </head>
    <body>
        <dialog open>
            <form>
                <div>
                    <label for="todo-title">Title:</label>
                    <input type="text" id="todo-title" />
                </div>
                <div>
                    <label for="todo-priority">Priority:</label>
                    <select id="todo-priority">
                        <option value="high">High</option>
                        <option value="normal" selected>Normal</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div>
                    <label for="todo-ds">Description:</label>
                    <input type="text" id="todo-ds" />
                </div>
                <div>
                    <label for="todo-project">Project:</label>
                    <select id="todo-project">
                        <option value="none">None</option>
                    </select>
                </div>
                <div>
                    <label for="todo-dueDate">Deadline:</label>
                    <input type="date" id="todo-dueDate" />
                </div>
                <button type="submit" class="add-todo">Add Todo</button>
            </form>
        </dialog>

        <dialog open style="margin-left: 1000px;">
            <form>
                <div>
                    <label for="project-title">Title</label>
                    <input type="text" id="project-title" />
                </div>
                <button type="submit" class="add-project">Add Project</button>
            </form>
        </dialog>
        
        <div class="todos"></div>
        <div class="projects"></div>
    </body>
</html>
